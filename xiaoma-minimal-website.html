
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小马 · 极简个人网站</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.card {
    background: white;
    padding: 50px 40px;
    border-radius: 24px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.06);
    width: 90%;
    max-width: 420px;
    text-align: center;
    transition: 0.3s ease;
}

.card:hover {
    transform: translateY(-5px);
}

h1 {
    margin: 0 0 12px;
    font-weight: 600;
    font-size: 26px;
    letter-spacing: 1px;
}

p {
    margin: 8px 0;
    color: #6e6e73;
}

button {
    padding: 10px 18px;
    border: none;
    border-radius: 12px;
    background: #000;
    color: white;
    cursor: pointer;
    margin-top: 12px;
    font-size: 14px;
}

button:hover {
    opacity: 0.85;
}

input {
    padding: 10px;
    border-radius: 12px;
    border: 1px solid #ddd;
    width: 100%;
    margin-top: 12px;
    font-size: 14px;
}

.hidden {
    display: none;
}

#admin-panel {
    margin-top: 25px;
    border-top: 1px solid #eee;
    padding-top: 20px;
}

.small {
    font-size: 12px;
    color: #999;
    margin-top: 12px;
}
</style>
</head>

<body>

<div class="card">

    <div id="content" class="hidden">
        <h1>小马</h1>
        <p>2461945890@qq.com</p>
        <p>极简 · 克制 · 高级</p>
    </div>

    <div id="password-section" class="hidden">
        <input type="password" id="password" placeholder="输入管理员密码">
        <button onclick="checkPassword()">进入后台</button>
    </div>

    <div id="message" class="small"></div>

    <div id="admin-panel" class="hidden">
        <p><strong>访问时间设置</strong></p>
        <input type="number" id="start-time" min="0" max="23" placeholder="开始时间 (0-23)">
        <input type="number" id="end-time" min="0" max="23" placeholder="结束时间 (0-23)">
        <button onclick="saveAccessTime()">保存设置</button>
        <div class="small" id="admin-msg"></div>
    </div>

</div>

<script>
const ADMIN_PASSWORD = "psqje873";

if (!localStorage.getItem("ACCESS_START")) localStorage.setItem("ACCESS_START", 8);
if (!localStorage.getItem("ACCESS_END")) localStorage.setItem("ACCESS_END", 20);

window.onload = () => {
    const isAdmin = localStorage.getItem("isAdmin") === "true";
    const hour = new Date().getHours();
    const accessStart = parseInt(localStorage.getItem("ACCESS_START"));
    const accessEnd = parseInt(localStorage.getItem("ACCESS_END"));

    if (isAdmin) {
        showContent();
        showAdminPanel();
    } else if (hour >= accessStart && hour < accessEnd) {
        showContent();
    } else {
        showPasswordPrompt();
    }
};

function showContent() {
    document.getElementById("content").classList.remove("hidden");
    document.getElementById("password-section").classList.add("hidden");
    document.getElementById("message").innerText = "";
}

function showPasswordPrompt() {
    document.getElementById("password-section").classList.remove("hidden");
    const start = localStorage.getItem("ACCESS_START");
    const end = localStorage.getItem("ACCESS_END");
    document.getElementById("message").innerText =
        `开放时间 ${start}:00 - ${end}:00`;
}

function checkPassword() {
    const pw = document.getElementById("password").value;
    if (pw === ADMIN_PASSWORD) {
        localStorage.setItem("isAdmin", "true");
        showContent();
        showAdminPanel();
    } else {
        alert("密码错误");
    }
}

function showAdminPanel() {
    document.getElementById("admin-panel").classList.remove("hidden");
    document.getElementById("start-time").value = localStorage.getItem("ACCESS_START");
    document.getElementById("end-time").value = localStorage.getItem("ACCESS_END");
}

function saveAccessTime() {
    const start = parseInt(document.getElementById("start-time").value);
    const end = parseInt(document.getElementById("end-time").value);

    if (start >= 0 && start <= 23 && end >= 0 && end <= 23) {
        localStorage.setItem("ACCESS_START", start);
        localStorage.setItem("ACCESS_END", end);
        document.getElementById("admin-msg").innerText = "设置已保存";
    } else {
        alert("请输入 0-23 之间的时间");
    }
}
</script>

</body>
</html>
